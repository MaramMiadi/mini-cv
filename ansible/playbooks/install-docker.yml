---
- name: Vérifier et configurer Docker
  hosts: portfolio_servers
  become: true

  tasks:
    - name: Vérifier que Docker CE est installé
      ansible.builtin.apt:
        name: docker-ce
        state: present
        update_cache: false

    - name: Activer et démarrer Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Vérifier la version de Docker
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false

    - name: Afficher la version de Docker
      ansible.builtin.debug:
        var: docker_version.stdout
