services:
  db:
    image: postgres:16-alpine
    container_name: mini-cv-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio_dev_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - portfolio-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio_user -d portfolio"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: mini-cv-api:latest
    container_name: mini-cv-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://portfolio_user:portfolio_dev_password@db:5432/portfolio?schema=public
    expose:
      - "4000"
    networks:
      - portfolio-net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: mini-cv-frontend:latest
    container_name: mini-cv-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      API_URL: "http://api:4000"
    ports:
      - "3000:3000"
    networks:
      - portfolio-net
    depends_on:
      api:
        condition: service_healthy

networks:
  portfolio-net:
    driver: bridge

volumes:
  postgres-data:
