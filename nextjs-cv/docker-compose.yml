services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: mini-cv-api:latest
    container_name: mini-cv-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
    expose:
      - "4000"
    networks:
      - portfolio-net
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: mini-cv-frontend:latest
    container_name: mini-cv-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      API_URL: "http://api:4000"
    ports:
      - "3000:3000"
    networks:
      - portfolio-net
    depends_on:
      api:
        condition: service_healthy

networks:
  portfolio-net:
    driver: bridge
