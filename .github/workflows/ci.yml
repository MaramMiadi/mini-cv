
name: mini-cv CI

on:
  push:
    branches: [act5, main]
  pull_request:
    branches: [act5, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mini-cv-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: Secret scan with Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Scan repository with Gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:latest \
            detect \
            --source /repo \
            --gitleaks-ignore-path .gitleaksignore \
            --exit-code 1

  sast:
    name: SAST with Semgrep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Scan source code with Semgrep
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            semgrep/semgrep:latest \
            semgrep scan --config auto --error .

  frontend-tests:
    name: Frontend tests and dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs-cv

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nextjs-cv/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  api-tests:
    name: API tests and dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs-cv/api

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: portfolio
          POSTGRES_USER: portfolio_user
          POSTGRES_PASSWORD: portfolio_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio_user -d portfolio"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://portfolio_user:portfolio_test_password@localhost:5432/portfolio?schema=public
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nextjs-cv/api/package-lock.json

      - name: Install API dependencies
        run: npm ci

      - name: Audit API dependencies
        run: npm audit --audit-level=high

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Run API tests
        run: npm test

  
  docker-build:
    name: Build and scan Docker images
    runs-on: ubuntu-latest
    needs:
      - secrets-scan
      - sast
      - frontend-tests
      - api-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Build frontend image
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991
        with:
          context: ./nextjs-cv
          file: ./nextjs-cv/Dockerfile
          push: false
          load: true
          tags: mini-cv-frontend:ci

      - name: Build API image
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991
        with:
          context: ./nextjs-cv/api
          file: ./nextjs-cv/api/Dockerfile
          push: false
          load: true
          tags: mini-cv-api:ci

      - name: Scan frontend image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.2 \
            image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            mini-cv-frontend:ci

      - name: Scan API image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.2 \
            image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            mini-cv-api:ci

